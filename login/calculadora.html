<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
</head>
<link rel="stylesheet" href="styles.css">

<body class="bodyCalculadora">
    <div class="cajaCalculadora">
        <h1>Calculadora</h1>
        <p>Bienvenido a la calculadora</p>

        <input type="number" id="num1" placeholder="Número 1">
        <input type="number" id="num2" placeholder="Número 2">
        <div class="botones">
            <button onclick="sumar()">Sumar</button>
            <button onclick="restar()">Restar</button>
            <button onclick="multiplicar()">Multiplicar</button>
            <button onclick="dividir()">Dividir</button>
        </div>
        <p id="mensaje"></p>
        <img id="imagenCalculadora" class="imagenCalculadora">
    </div>
    <script>
        function sumar() {
            let num1Value = document.getElementById("num1").value.trim();
            let num2Value = document.getElementById("num2").value.trim();

            if (num1Value === "" || num2Value === "" || isNaN(num1Value) || isNaN(num2Value)) {
                document.getElementById("mensaje").innerHTML =
                    "Error: Por favor ingresa números válidos en ambos campos.";
                document.getElementById("imagenCalculadora").src = "resource/gatitoEnojado.jpg";
                return;
            }
            let num1 = parseFloat(num1Value);
            let num2 = parseFloat(num2Value);

            let resultado = num1 + num2;

            document.getElementById("mensaje").innerHTML = "El resultado de la suma es: " + resultado;
            document.getElementById("imagenCalculadora").src = "resource/gatitoPulgar.jpg";
        }

        function restar() {
            let num1Value = document.getElementById("num1").value.trim();
            let num2Value = document.getElementById("num2").value.trim();

            if (num1Value === "" || num2Value === "" || isNaN(num1Value) || isNaN(num2Value)) {
                document.getElementById("mensaje").innerHTML =
                    "Error: Por favor ingresa números válidos en ambos campos.";
                document.getElementById("imagenCalculadora").src = "resource/gatitoEnojado.jpg";
                return;
            }
            let num1 = parseFloat(num1Value);
            let num2 = parseFloat(num2Value);

            let resultado = num1 - num2;

            document.getElementById("mensaje").innerHTML = "El resultado de la resta es: " + resultado;
            document.getElementById("imagenCalculadora").src = "resource/gatitoPulgar.jpg";
        }

        function multiplicar() {
            let num1Value = document.getElementById("num1").value.trim();
            let num2Value = document.getElementById("num2").value.trim();

            if (num1Value === "" || num2Value === "" || isNaN(num1Value) || isNaN(num2Value)) {
                document.getElementById("mensaje").innerHTML =
                    "Error: Por favor ingresa números válidos en ambos campos.";
                document.getElementById("imagenCalculadora").src = "resource/gatitoEnojado.jpg";
                return;
            }
            let num1 = parseFloat(num1Value);
            let num2 = parseFloat(num2Value);

            let resultado = num1 * num2;

            document.getElementById("mensaje").innerHTML = "El resultado de la multiplicación es: " + resultado;
            document.getElementById("imagenCalculadora").src = "resource/gatitoPulgar.jpg";
        }

        function dividir() {
            let num1Value = document.getElementById("num1").value.trim();
            let num2Value = document.getElementById("num2").value.trim();

            if (num1Value === "" || num2Value === "" || isNaN(num1Value) || isNaN(num2Value)) {
                document.getElementById("mensaje").innerHTML =
                    "Error: Por favor ingresa números válidos en ambos campos.";
                document.getElementById("imagenCalculadora").src = "resource/gatitoEnojado.jpg";
                return;
            }
            let num1 = parseFloat(num1Value);
            let num2 = parseFloat(num2Value);

            if (num2 === 0) {
                document.getElementById("mensaje").innerHTML = "Error: No se puede dividir entre cero.";
                document.getElementById("imagenCalculadora").src = "resource/gatitoEnojado.jpg";
                return;
            }

            let resultado = num1 / num2;

            document.getElementById("mensaje").innerHTML = "El resultado de la división es: " + resultado;
            document.getElementById("imagenCalculadora").src = "resource/gatitoPulgar.jpg";
        }
    </script>
</body>

</html>
